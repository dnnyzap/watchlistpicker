# Render, Railway etc. passam a porta pela variavel PORT.
server.port=${PORT:8080}

# A chave vem da variavel de ambiente TMDB_API_KEY ou de um arquivo .env
# (na raiz do projeto ou dentro de backend/). Nunca coloque a chave aqui.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
tmdb.api.key=${TMDB_API_KEY:}
